name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/requirements-check.txt
      - run: python scripts/qa.py
      - name: Build committed release or preview
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/release.py --ref "$GITHUB_REF_NAME" --official --out "$RUNNER_TEMP/release"
          else
            python scripts/release.py --ref HEAD --out "$RUNNER_TEMP/release"
          fi
      - name: Read committed market history
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Lanbasara/zhixing-marketplace
          ref: main
          path: .marketplace-input
          fetch-depth: 1
          persist-credentials: false
      - name: Build data-only marketplace candidate
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: python scripts/marketplace.py --tag "$GITHUB_REF_NAME" --marketplace .marketplace-input --out "$RUNNER_TEMP/marketplace"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zhixing-release-${{ github.sha }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: zhixing-marketplace-${{ github.sha }}
          path: ${{ runner.temp }}/marketplace
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: source-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: zhixing-release-${{ github.sha }}
          path: release
      - name: Verify downloaded bytes
        run: sha256sum -c SHA256SUMS
        working-directory: release
      - name: Publish immutable release
        working-directory: release
        run: gh release create "$GITHUB_REF_NAME" zhixing-plugin.zip release.json SHA256SUMS --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
